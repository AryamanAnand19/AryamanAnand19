<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Aryaman Anand. MSc AI at NTU. Agents, evals, grounded LLMs.">
  <defs>
    <radialGradient id="bg" cx=".75" cy=".5" r=".95">
      <stop offset="0" stop-color="#101c36"/><stop offset="1" stop-color="#04060c"/>
    </radialGradient>
    <radialGradient id="orb" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".25" stop-color="#bfe3ff"/>
      <stop offset=".6" stop-color="#5b8cff" stop-opacity=".55"/><stop offset="1" stop-color="#5b8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#cfe6ff"/><stop offset="1" stop-color="#a9b8ff"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fd0ff" stop-opacity=".9"/><stop offset=".5" stop-color="#b9a4ff" stop-opacity=".45"/><stop offset="1" stop-color="#7ef0ff" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".12"/><stop offset="1" stop-color="#ffffff" stop-opacity=".03"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <style>
    .name { font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight:700; font-size:58px; fill:url(#name); letter-spacing:-1px; }
    .role { font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight:500; font-size:19px; fill:#a9bddf; letter-spacing:.3px; }
    .pill { font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight:600; font-size:13px; fill:#dbe9ff; letter-spacing:.4px; }
    .eyebrow { font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight:600; font-size:12px; fill:#7ea6ff; letter-spacing:3.5px; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @keyframes breathe { 50% { transform:scale(1.1); } }
    @keyframes tw { 50% { opacity:.15; } }
    @keyframes blink { 50% { opacity:.3; } }
  
    @media (prefers-reduced-motion: no-preference) {
    .r1 { transform-origin:730px 130px; animation:spin 70s linear infinite; }
    .r2 { transform-origin:730px 130px; animation:spin 45s linear infinite reverse; }
    .r3 { transform-origin:730px 130px; animation:spin 30s linear infinite; }
    .breathe { transform-origin:730px 130px; animation:breathe 6s ease-in-out infinite; }
    .tw { animation:tw 4s ease-in-out infinite; } .tw2 { animation-delay:-1.3s } .tw3 { animation-delay:-2.6s }
    .dot { animation:blink 2.4s ease-in-out infinite; }
    }
</style>

  <rect width="900" height="260" rx="18" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="899" height="259" rx="17.5" fill="none" stroke="#9fd0ff" stroke-opacity=".18"/>

  <g fill="#cfe6ff">
    <circle cx="60" cy="40" r="1.2" class="tw" opacity=".7"/><circle cx="420" cy="30" r="1" class="tw tw2" opacity=".6"/>
    <circle cx="560" cy="220" r="1.2" class="tw tw3" opacity=".7"/><circle cx="880" cy="40" r="1" class="tw" opacity=".6"/>
    <circle cx="350" cy="236" r="1" class="tw tw2" opacity=".5"/><circle cx="610" cy="48" r="1.3" class="tw tw3" opacity=".7"/>
  </g>

  <!-- orbital core, right side -->
  <circle cx="730" cy="130" r="150" fill="#7aa8ff" opacity=".07"/>
  <g fill="none" stroke="#9fd0ff" stroke-width="1">
    <circle cx="730" cy="130" r="108" stroke-opacity=".13"/>
    <circle cx="730" cy="130" r="82" stroke-opacity=".2" stroke-dasharray="1 5" class="r1"/>
    <ellipse cx="730" cy="130" rx="150" ry="52" stroke-opacity=".18" class="r3" transform="rotate(-20 730 130)"/>
    <ellipse cx="730" cy="130" rx="150" ry="52" stroke-opacity=".13" class="r2" transform="rotate(26 730 130)"/>
  </g>
  <g class="r1"><circle cx="812" cy="130" r="3" fill="#7ef0ff"/></g>
  <g class="r2"><circle cx="730" cy="22" r="2.5" fill="#b9a4ff"/></g>
  <g class="breathe">
    <circle cx="730" cy="130" r="44" fill="url(#orb)" filter="url(#soft)"/>
    <circle cx="730" cy="130" r="26" fill="url(#orb)"/>
  </g>

  <!-- copy -->
  <text x="48" y="64" class="eyebrow">MSC AI · NTU SINGAPORE</text>
  <text x="46" y="128" class="name">Aryaman Anand</text>
  <text x="48" y="164" class="role">Agents · Evals · Grounded LLMs</text>

  <g>
    <rect x="48" y="188" width="410" height="34" rx="17" fill="url(#glass)" stroke="url(#rim)"/>
    <circle cx="68" cy="205" r="4.5" fill="#4dffb0" class="dot"/>
    <text x="82" y="210" class="pill">Open to internships Jan 2027 · full-time Aug 2027</text>
  </g>
</svg>
