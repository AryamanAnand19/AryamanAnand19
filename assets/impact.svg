<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150" role="img" aria-label="Impact at a glance: about 4,500 conversations a day in production; 82% resolved without human handoff; 0.9785 TechnicalScore on TikTok TechJam Needle; 71% fewer name and location misrecognitions across 40+ languages.">
  <defs>
    <radialGradient id="bg" cx=".5" cy="0" r="1.2">
      <stop offset="0" stop-color="#101c36"/><stop offset="1" stop-color="#04060c"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fd0ff" stop-opacity=".8"/><stop offset=".5" stop-color="#b9a4ff" stop-opacity=".35"/><stop offset="1" stop-color="#7ef0ff" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".09"/><stop offset="1" stop-color="#ffffff" stop-opacity=".02"/>
    </linearGradient>
    <linearGradient id="num" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#a9c8ff"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ef0ff" stop-opacity="0"/><stop offset=".5" stop-color="#cfe6ff" stop-opacity=".9"/><stop offset="1" stop-color="#7ef0ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .n { font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight:700; font-size:34px; fill:url(#num); letter-spacing:-.5px; }
    .k { font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight:600; font-size:14px; fill:#dbe9ff; }
    .s { font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif; font-size:12.5px; fill:#8fa3c7; letter-spacing:.3px; }
    @media (prefers-reduced-motion: no-preference) {
      .t { opacity:0; animation:in .9s ease-out forwards; }
      .t2 { animation-delay:.25s } .t3 { animation-delay:.5s } .t4 { animation-delay:.75s }
    }
    @keyframes in { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
    @keyframes sw { 0% { transform:translateX(-200px); } 60%,100% { transform:translateX(1000px); } }
  
    @media (prefers-reduced-motion: no-preference) {
    .sw { animation:sw 6s ease-in-out infinite; }
    }
</style>
  <rect width="900" height="150" rx="18" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="899" height="149" rx="17.5" fill="none" stroke="#9fd0ff" stroke-opacity=".18"/>
  <rect x="0" y="0" width="160" height="1.5" fill="url(#sweep)" class="sw"/>

  <g class="t">
    <rect x="18" y="18" width="201" height="114" rx="14" fill="url(#glass)" stroke="url(#rim)"/>
    <text x="36" y="64" class="n">~4,500</text>
    <text x="36" y="90" class="k">conversations a day</text>
    <text x="36" y="110" class="s">production agents · 5 countries</text>
  </g>
  <g class="t t2">
    <rect x="235" y="18" width="201" height="114" rx="14" fill="url(#glass)" stroke="url(#rim)"/>
    <text x="253" y="64" class="n">82%</text>
    <text x="253" y="90" class="k">resolved without handoff</text>
    <text x="253" y="110" class="s">voice + chat · Hotelzify</text>
  </g>
  <g class="t t3">
    <rect x="452" y="18" width="201" height="114" rx="14" fill="url(#glass)" stroke="url(#rim)"/>
    <text x="470" y="64" class="n">0.9785</text>
    <text x="470" y="90" class="k">TechnicalScore</text>
    <text x="470" y="110" class="s">TikTok TechJam · zero LLM calls</text>
  </g>
  <g class="t t4">
    <rect x="669" y="18" width="213" height="114" rx="14" fill="url(#glass)" stroke="url(#rim)"/>
    <text x="687" y="64" class="n">−71%</text>
    <text x="687" y="90" class="k">name misrecognition</text>
    <text x="687" y="110" class="s">TTS lexicon · 40+ languages</text>
  </g>
</svg>
